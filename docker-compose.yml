version: '3.8'

services:
  llm_engine:
    build: .
    container_name: llm_engine
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      # Default to tiny model for constrained hardware
      - MODEL_NAME=Qwen/Qwen1.5-0.5B 
      - GPU_MEMORY_UTILIZATION=0.85
      - MAX_MODEL_LEN=512
      - TENSOR_PARALLEL_SIZE=1
      - REDIS_URL=redis://redis:6379/0
    volumes:
      # Cache downloaded models so we don't redownload them every time
      - huggingface_cache:/root/.cache/huggingface

  redis:
    image: redis:alpine
    container_name: redis_cache
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686" # Web UI
      - "4317:4317"   # OTLP gRPC

  ray-head:
    image: rayproject/ray:2.9.0-py310
    container_name: ray-head
    command: bash -c "ray start --head --dashboard-host=0.0.0.0 --port=6379 --block"
    ports:
      - "8265:8265"
      - "10001:10001"

  ray-worker:
    image: rayproject/ray:2.9.0-py310
    container_name: ray-worker
    command: bash -c "ray start --address=ray-head:6379 --block"
    depends_on:
      - ray-head

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning

volumes:
  huggingface_cache:
