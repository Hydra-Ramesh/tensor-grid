apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-dpo-lora-training
  namespace: llm-gateway
spec:
  schedule: "0 2 * * *" # Run at 2:00 AM every night
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: lora-trainer
            image: llm-trainer:v1
            command:
            - python
            - scripts/train_lora_nightly.py
            volumeMounts:
            - name: model-storage
              mountPath: /app/models
            - name: db-storage
              mountPath: /app/data
            resources:
              requests:
                nvidia.com/gpu: "1" # Request exactly 1 GPU for training
              limits:
                nvidia.com/gpu: "1"
          volumes:
          - name: model-storage
            persistentVolumeClaim:
              claimName: lora-pvc
          - name: db-storage
            persistentVolumeClaim:
              claimName: sqlite-pvc
          restartPolicy: OnFailure
