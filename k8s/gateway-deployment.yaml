apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  labels:
    app: llm-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-gateway
  template:
    metadata:
      labels:
        app: llm-gateway
    spec:
      containers:
      - name: llm-gateway
        image: llm-engine-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: REDIS_URL
          value: "redis://redis-service:6379/0"
        - name: QDRANT_URL
          value: "http://qdrant-service:6333"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://jaeger-service:4317"
        resources:
          limits:
            nvidia.com/gpu: 1
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
spec:
  selector:
    app: llm-gateway
  ports:
  - port: 80
    targetPort: 8000
  type: LoadBalancer
