name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Formatters & Linters
      run: |
        black --check src tests
        isort --check-only src tests
        flake8 src tests
        mypy src tests --ignore-missing-imports
        
    - name: Run Unit Tests
      run: |
        pytest tests/unit/ -v --asyncio-mode=auto

  load-test:
    name: CI/CD Performance Gate
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install Locust
        run: pip install locust
      - name: Run Load Test against Staging Environment
        # Blocks the PR if latency SLA is breached (Locust non-zero exit code)
        env:
          STAGING_URL: ${{ secrets.STAGING_URL || 'http://localhost:8000' }}
          API_KEY: ${{ secrets.API_KEY || 'default-secret-key-123' }}
        run: |
          echo "Running performance gate check..."
          # Note: Fails if average response time > 500ms or fail ratio > 1% (Requires custom locust exit code config in production)
          locust -f tests/load_test/locustfile.py --headless -u 50 -r 10 --run-time 30s --host $STAGING_URL
        
  build-docker:
    needs: lint-and-test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker Image
      run: |
        docker build -t llm-engine-gateway:latest .
